mechanisms:

  M001:
    name: Promotion Delay
    domain: Career Progression

    description: >
      Employees appear to remain in the same role or level for extended periods
      before advancement opportunities.

    observable_variables:
      - YearsSinceLastPromotion
      - YearsInCurrentRole

    business_problem:
      Slowed internal career progression

    candidate_interventions: []

  M002:
    name: Career Stagnation
    domain: Career Progression

    description: >
      Employees accumulate organizational tenure without proportional
      advancement in responsibility or level.

    observable_variables:
      - YearsAtCompany
      - YearsInCurrentRole
      - JobLevel

    business_problem:
      Limited career growth

    candidate_interventions: []

  M003:
    name: Compensation Progression Pressure
    domain: Compensation

    description: >
      Compensation growth patterns may be associated with modeled workforce
      attrition exposure.

    observable_variables:
      - MonthlyIncome
      - PercentSalaryHike
      - StockOptionLevel

    business_problem:
      Compensation competitiveness

    candidate_interventions: []
