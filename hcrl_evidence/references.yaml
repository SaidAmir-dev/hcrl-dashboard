  - id: hom_2017
    title: "One Hundred Years of Employee Turnover Theory and Research"
    authors: "Hom, Lee, Shaw, Hausknecht"
    year: 2017
    evidence_type: "research_review"
    relevance:
      - turnover
      - retention
      - job_embeddedness
      - shocks
      - withdrawal
    limitation: "Broad theoretical review; does not prescribe automatic interventions."

  - id: hausknecht_2009
    title: "Targeted Employee Retention: Performance-Based and Job-Related Differences in Reported Reasons for Staying"
    authors: "Hausknecht, Rodda, Howard"
