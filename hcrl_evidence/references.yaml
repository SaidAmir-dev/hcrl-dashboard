references:
  - id: griffeth_2000
    title: "A Meta-Analysis of Antecedents and Correlates of Employee Turnover"
    authors: "Griffeth, Hom, Gaertner"
    year: 2000
    evidence_type: "meta_analysis"
    relevance:
      - turnover
      - job_satisfaction
      - organizational_commitment
      - pay
      - career_progression
